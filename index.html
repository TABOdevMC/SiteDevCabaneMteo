<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast - CabaneMeteo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌤️ CabaneMeteo</h1>
            <p class="subtitle">Your Weather Forecast</p>
        </header>

        <div class="search-container">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Enter city name..." 
                class="search-input"
            >
            <button id="searchBtn" class="search-btn">Search</button>
            <button id="currentLocationBtn" class="location-btn">📍 Current Location</button>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <div id="currentWeather" class="weather-card hidden">
            <div class="weather-header">
                <h2 id="cityName"></h2>
                <p id="weatherDescription"></p>
            </div>
            <div class="weather-main">
                <div class="temperature">
                    <span id="temp"></span>°C
                </div>
                <div class="weather-icon">
                    <span id="weatherIcon"></span>
                </div>
            </div>
            <div class="weather-details">
                <div class="detail">
                    <span class="label">Feels Like</span>
                    <span id="feelsLike" class="value"></span>°C
                </div>
                <div class="detail">
                    <span class="label">Humidity</span>
                    <span id="humidity" class="value"></span>%
                </div>
                <div class="detail">
                    <span class="label">Wind Speed</span>
                    <span id="windSpeed" class="value"></span> km/h
                </div>
                <div class="detail">
                    <span class="label">Pressure</span>
                    <span id="pressure" class="value"></span> hPa
                </div>
                <div class="detail">
                    <span class="label">Precipitation</span>
                    <span id="precipitation" class="value"></span> mm
                </div>
                <div class="detail">
                    <span class="label">Cloud Cover</span>
                    <span id="cloudCover" class="value"></span>%
                </div>
            </div>
        </div>

        <div id="forecast" class="forecast-container hidden">
            <h3>7-Day Forecast</h3>
            <div id="forecastCards" class="forecast-cards"></div>
        </div>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <p>Loading weather data...</p>
        </div>
    </div>

    <footer>
        <p>Powered by <a href="https://open-meteo.com/" target="_blank">Open-Meteo</a> • No API Key Required</p>
        <p>© 2024 CabaneMeteo. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
